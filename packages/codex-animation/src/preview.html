<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TARDIS 五档动画</title>
<style>
  :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
  body { min-height: 100svh; margin: 0; display: grid; place-items: center; background: light-dark(#f5f5f7, #17191e); }
  main { width: min(620px, calc(100% - 36px)); }
  h1 { font-size: 19px; margin: 0 0 15px; }
  canvas { display: block; width: 100%; height: 68px; border: 1px solid #596579; border-radius: 999px; box-sizing: border-box; background: #080d19; image-rendering: pixelated; }
  .choices { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; margin-top: 10px; }
  button { min-height: 34px; border: 1px solid light-dark(#cacdd6, #393d47); border-radius: 8px; background: light-dark(#fff, #22252c); color: inherit; font: inherit; cursor: pointer; }
  button[aria-pressed=true] { border-color: #7e95be; background: light-dark(#e0ebfd, #304159); font-weight: 650; }
  button:focus-visible { outline: 2px solid #7e95be; outline-offset: 2px; }
</style>
<main>
  <h1>TARDIS 五档动画</h1>
  <canvas role="img" aria-label="伦敦熄灯"></canvas>
  <div class="choices" role="group" aria-label="预览档位"></div>
</main>
<script>
/* ANIMATION */
const canvas = document.querySelector('canvas');
const animation = mountTardisAnimation(canvas);
const choices = document.querySelector('.choices');
for (const stage of EFFORT_STAGES) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = stage.label;
  button.dataset.effort = stage.id;
  button.setAttribute('aria-pressed', String(stage.id === 'low'));
  button.addEventListener('click', () => {
    animation.setEffort(stage.id);
    canvas.setAttribute('aria-label', stage.scene);
    for (const control of choices.children) control.setAttribute('aria-pressed', String(control === button));
  });
  choices.append(button);
}
</script>
</html>
